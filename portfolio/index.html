<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eric Armstrong</title>
  <meta name="description" content="Eric Armstrong — product manager and builder.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="#">ericarmstrong.tech</a>
      <ul class="nav-links">
        <li><a href="#work">work</a></li>
        <li><a href="#about">about</a></li>
        <li><a href="#contact">contact</a></li>
      </ul>
    </div>
  </nav>

  <main>

    <section id="hero" class="section reveal">
      <div class="container hero-layout">
        <div class="hero-text">
          <p class="eyebrow">product manager + builder</p>
          <h1 class="hero-headline">Professional overthinker. <em class="accent">Amateur everything else.</em></h1>
          <p class="hero-sub" id="hero-subtitle"></p>
          <div class="pill-row" id="pill-row"></div>
        </div>
        <div class="hero-photo-wrap">
          <img class="hero-photo" src="eric.jpg" alt="Eric Armstrong">
        </div>
      </div>
    </section>

    <section id="work" class="section reveal">
      <div class="container">
        <p class="section-label">selected work</p>
        <div id="projects-feed"></div>
      </div>
    </section>

    <section id="about" class="section reveal">
      <div class="container">
        <p class="section-label">about</p>
        <div class="about-layout">
          <div class="about-stats" id="about-stats"></div>
          <div class="about-bio">
            <p id="about-bio-text"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="section reveal">
      <div class="container">
        <div class="contact-layout">
          <div class="contact-left">
            <h2 class="contact-headline">I break things so <em class="accent">you don't have to.</em></h2>
          </div>
          <div class="contact-right" id="contact-buttons"></div>
        </div>
      </div>
    </section>

  </main>

  <footer id="footer">
    <div class="container footer-inner">
      <span class="footer-left">ericarmstrong.tech — 2026</span>
      <span class="footer-right">built by me, obviously.</span>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
