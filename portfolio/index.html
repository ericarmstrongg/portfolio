<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eric Armstrong</title>
<meta name="description" content="Pickle Plate, Majestic Trips and Deadclock — iOS apps by Eric Armstrong.">
<meta name="theme-color" content="#06070d">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<meta property="og:title" content="Eric Armstrong">
<meta property="og:description" content="Pickle Plate, Majestic Trips and Deadclock — iOS apps by Eric Armstrong.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap">
<script>document.documentElement.classList.add("js");</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ===== depth effect layers (fixed, behind everything) ===== -->
<div class="bg" aria-hidden="true">
  <div class="aurora" id="aurora">
    <div class="aurora-inner"></div>
  </div>
  <canvas id="field"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

<main>

  <!-- ===== hero ===== -->
  <header class="hero">
    <div class="hero-inner" id="heroInner">
      <h1 class="name">Eric&nbsp;Armstrong</h1>
      <p class="tagline">Just building stuff.</p>
    </div>
    <div class="cue" id="cue" aria-hidden="true">
      <span class="cue-line"></span>
    </div>
  </header>

  <!-- ===== apps ===== -->
  <section class="apps" aria-labelledby="apps-heading">
    <h2 class="section-label" id="apps-heading">Apps</h2>

    <ul class="app-list">
      <li class="reveal">
        <a class="app" href="https://apps.apple.com/us/app/pickle-plate/id6765565381" target="_blank" rel="noopener noreferrer">
          <picture>
            <source srcset="/icons/pickle-plate.webp" type="image/webp">
            <img class="app-icon" src="/icons/pickle-plate.jpg" alt="" width="256" height="256" loading="lazy" decoding="async">
          </picture>
          <span class="app-text">
            <span class="app-title">Pickle Plate</span>
            <span class="app-sub">Menu Scanner - Allergies/Diets</span>
          </span>
          <svg class="app-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>

      <li class="reveal">
        <a class="app" href="https://apps.apple.com/us/app/majestic-trips/id6740096638" target="_blank" rel="noopener noreferrer">
          <picture>
            <source srcset="/icons/majestic-trips.webp" type="image/webp">
            <img class="app-icon" src="/icons/majestic-trips.jpg" alt="" width="256" height="256" loading="lazy" decoding="async">
          </picture>
          <span class="app-text">
            <span class="app-title">Majestic Trips</span>
            <span class="app-sub">Travel planning for groups</span>
          </span>
          <svg class="app-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>

      <li class="reveal">
        <a class="app" href="https://apps.apple.com/us/app/deadclock-spawn-timers/id6738394006" target="_blank" rel="noopener noreferrer">
          <picture>
            <source srcset="/icons/deadclock.webp" type="image/webp">
            <img class="app-icon" src="/icons/deadclock.jpg" alt="" width="256" height="256" loading="lazy" decoding="async">
          </picture>
          <span class="app-text">
            <span class="app-title">Deadclock</span>
            <span class="app-sub">Spawn Timers for Deadlock</span>
          </span>
          <svg class="app-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
    </ul>
  </section>

  <!-- ===== contact ===== -->
  <footer class="contact reveal">
    <h2 class="section-label">Elsewhere</h2>
    <ul class="links">
      <li>
        <a href="mailto:hi@ericarmstrong.tech">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="2.75" y="4.75" width="18.5" height="14.5" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3.5 7.5l7.62 5.24a1.6 1.6 0 001.76 0L20.5 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span>hi@ericarmstrong.tech</span>
        </a>
      </li>
      <li>
        <a href="https://github.com/ericarmstrongg" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2.2a9.8 9.8 0 00-3.1 19.1c.49.09.67-.21.67-.47l-.01-1.84c-2.73.59-3.3-1.15-3.3-1.15-.45-1.14-1.09-1.44-1.09-1.44-.89-.61.07-.6.07-.6.98.07 1.5 1.01 1.5 1.01.88 1.5 2.3 1.07 2.86.82.09-.64.34-1.07.62-1.32-2.18-.25-4.47-1.09-4.47-4.85 0-1.07.38-1.95 1.01-2.63-.1-.25-.44-1.25.1-2.61 0 0 .83-.27 2.71 1.01a9.4 9.4 0 014.94 0c1.88-1.28 2.7-1.01 2.7-1.01.55 1.36.2 2.36.1 2.61.63.68 1.01 1.56 1.01 2.63 0 3.77-2.29 4.6-4.48 4.84.35.3.66.9.66 1.82l-.01 2.7c0 .26.18.57.68.47A9.8 9.8 0 0012 2.2z" fill="currentColor"/>
          </svg>
          <span>GitHub</span>
        </a>
      </li>
      <li>
        <a href="https://www.linkedin.com/in/ericarmstrong" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.98 3.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM3 9.5h4v11H3v-11zM10 9.5h3.8v1.5a4.2 4.2 0 013.7-1.9c3 0 4.5 1.85 4.5 5.3v6.1h-4v-5.6c0-1.6-.6-2.5-2-2.5-1.3 0-2 .85-2 2.5v5.6h-4v-11z" fill="currentColor"/>
          </svg>
          <span>LinkedIn</span>
        </a>
      </li>
    </ul>
  </footer>

</main>

<script src="/app.js" defer></script>
</body>
</html>
