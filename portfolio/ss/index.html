<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e3ecf6">
<title>Secret Santa</title>
<style>
  :root{
    --sky-top:#dce7f4;--sky-mid:#ecf2f9;--sky-bottom:#f7f9fc;
    --card:rgba(255,255,255,.94);--well:#f3f6fa;--line:#e1e8f0;--field:#fff;--field-line:#cfd9e5;
    --ink:#1b2838;--muted:#56677b;--faint:#8794a5;
    --accent:#2d5d8b;--accent-ink:#fff;--accent-soft:#e6eef8;
    --warn:#8a5410;--warn-soft:#fbf1df;
    --gift:#a8323f;--gift-soft:#f9e9eb;--book:#2c6a52;--book-soft:#e5f1eb;--wild-soft:#eef1f5;
    --shadow:0 1px 2px rgba(27,40,56,.05),0 6px 20px rgba(45,93,139,.08);
    --r:16px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;color:var(--ink);background:var(--sky-bottom);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  /* The sky is a fixed layer rather than background-attachment:fixed, which iOS ignores. */
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-bottom) 100%)}

  /* ── Snow: CSS transforms only, so it runs on the compositor and costs the page nothing per frame. ── */
  #snow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  #snow i{position:absolute;top:0;border-radius:50%;background:#fff;
    box-shadow:0 0 2px rgba(45,93,139,.3);animation:fall linear infinite;will-change:transform}
  @keyframes fall{
    0%{transform:translate3d(0,-3vh,0)}
    50%{transform:translate3d(calc(var(--x) * .5 + var(--s)),50vh,0)}
    100%{transform:translate3d(var(--x),103vh,0)}
  }
  @media (prefers-reduced-motion:reduce){#snow{display:none}}

  .wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:0 16px 72px}

  /* ── Header and nav ── */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px 10px}
  .brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
  .brand .flake{color:var(--accent);font-size:18px}
  .hello{color:var(--muted);font-size:15px}
  .tabs{position:sticky;top:0;z-index:5;margin:0 -16px 18px;padding:8px 16px;
    background:rgba(236,242,249,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .tabs .seg{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px}
  .tabs a{flex:1;text-align:center;padding:8px 4px;border-radius:10px;color:var(--muted);text-decoration:none;
    font-size:14px;font-weight:600;white-space:nowrap}
  .tabs a[aria-current=page]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(27,40,56,.12)}

  /* ── Type ── */
  h2{font-size:22px;line-height:1.25;margin:0;letter-spacing:-.01em}
  .intro{color:var(--muted);margin:6px 0 16px;font-size:15px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .note{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;margin:6px 0 16px}
  p{margin:0}

  /* ── Cards ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:0 0 14px}
  .person-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .person-head h3{font-size:20px;margin:0 auto 0 0;letter-spacing:-.01em}
  .block+.block{margin-top:16px}
  .label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  .label .aside{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:12.5px}
  .well{background:var(--well);border-radius:12px;padding:12px 14px}
  .idea+.idea{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .idea-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:3px}
  .text{white-space:pre-wrap;overflow-wrap:anywhere}
  .empty{color:var(--faint);font-size:15px}
  .hints{list-style:none;margin:0;padding:0}
  .hints li{background:var(--well);border-radius:12px;padding:10px 14px}
  .hints li+li{margin-top:8px}
  .by{display:flex;align-items:center;gap:4px;margin-top:4px;color:var(--faint);font-size:13px}

  .tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .tag.gift{background:var(--gift-soft);color:var(--gift)}
  .tag.book{background:var(--book-soft);color:var(--book)}
  .tag.wild{background:var(--wild-soft);color:var(--muted)}
  .tag.new{background:var(--accent-soft);color:var(--accent);font-size:11.5px;padding:2px 8px}
  .news{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 14px;margin:-6px 0 16px;font-size:14.5px;font-weight:500}
  details.card.has-new summary h3::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gift);margin-left:7px;vertical-align:middle}

  /* Everyone: the same card, collapsed to its header. */
  details.card{padding:0}
  details.card summary{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:15px 18px;cursor:pointer;list-style:none}
  details.card summary::-webkit-details-marker{display:none}
  details.card summary h3{font-size:18px;margin:0 auto 0 0}
  details.card summary .count{color:var(--faint);font-size:13.5px}
  details.card summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
    transform:rotate(45deg);margin:-4px 4px 0 6px;transition:transform .15s}
  details.card[open] summary::after{transform:rotate(-135deg);margin-top:4px}
  details.card .body{padding:2px 18px 18px;border-top:1px solid var(--line);padding-top:16px}

  /* ── Controls ── */
  textarea{display:block;width:100%;min-height:104px;background:var(--field);color:inherit;border:1px solid var(--field-line);
    border-radius:12px;padding:11px 12px;font:inherit;resize:vertical}
  textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .field+.field{margin-top:16px}
  .field .hint-text{color:var(--faint);font-size:13.5px;margin:-2px 0 8px}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 18px;font-weight:600}
  .btn:disabled{opacity:.55}
  .btn.outline{background:#fff;color:var(--accent);border:1px solid var(--field-line);padding:7px 14px;font-size:15px}
  .link{background:none;border:0;color:var(--accent);padding:2px 4px;font-size:13px;font-weight:600}
  .actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:14px}
  .status{color:var(--muted);font-size:14px}
  .lock{color:var(--muted);font-size:13.5px}
  /* Sizes and favorites: one field per line, with tap-to-fill chips under the letter sizes. */
  input.detail{display:block;width:100%;background:var(--field);color:inherit;border:1px solid var(--field-line);
    border-radius:10px;padding:9px 11px;font:inherit;font-size:16px}
  input.detail::placeholder{color:var(--faint)}
  input.detail:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .details{display:grid;grid-template-columns:1fr;gap:14px}
  .details label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:0 0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chips button{border:1px solid var(--field-line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600;min-width:38px}
  .chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .subhead{font-size:15px;font-weight:700;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
  .subhead+.hint-text{color:var(--faint);font-size:13.5px;margin:0 0 12px}
  /* Read side: label over value, in a grid, so a size is findable at a glance in a shop. */
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 14px}
  .facts .k{font-size:12.5px;font-weight:600;color:var(--muted)}
  .facts .v{font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
  .facts.wide{grid-template-columns:1fr}
  .facts.wide .v{font-weight:500}
  /* Got it: a tick per thing you're buying, and who else is on the same person. */
  .got{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
  .check{display:flex;align-items:center;gap:10px;background:var(--well);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:15px}
  .check input{width:20px;height:20px;accent-color:var(--book);margin:0;flex:none}
  .check:has(input:checked){background:var(--book-soft);color:var(--book)}
  .check .with{display:block;font-weight:500;font-size:13.5px;color:var(--muted);margin-top:1px}
  .progress{color:var(--muted);font-size:14px;margin:-8px 0 16px}
  .add{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .add textarea{min-height:72px}

  .choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
  .choices label{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--field-line);border-radius:12px;padding:9px 11px;cursor:pointer;font-size:15px}
  .choices label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .choices input{accent-color:var(--accent);margin:0}
  .pick+.pick{margin-top:16px}

  /* ── Organizer ── */
  .meter{height:8px;border-radius:99px;background:var(--well);overflow:hidden;margin:10px 0 12px}
  .meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
  .gap{display:flex;gap:8px;align-items:baseline;font-size:15px;margin-top:6px}
  .rows{padding:4px 0}
  .giver{display:flex;align-items:center;gap:12px;padding:12px 18px}
  .giver+.giver{border-top:1px solid var(--line)}
  .giver .who{font-weight:600;min-width:72px}
  .giver .what{flex:1;display:flex;flex-wrap:wrap;gap:6px;font-size:14px}
  .giver.editing{display:block;background:var(--well)}

  /* ── The survey: a sheet over the page, one question at a time ── */
  .cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,#fff 0%,var(--accent-soft) 100%)}
  .cta p{flex:1 1 220px;color:var(--muted);font-size:15px}
  .cta strong{display:block;color:var(--ink);font-size:16.5px;margin-bottom:2px}
  #survey{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(27,40,56,.38)}
  #survey[hidden]{display:none}
  #survey .sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px 22px;
    box-shadow:0 -8px 30px rgba(27,40,56,.18)}
  @media (min-width:600px){#survey{align-items:center}#survey .sheet{border-radius:22px}}
  .sv-top{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13.5px;font-weight:600}
  .sv-top .meter{flex:1;margin:0}
  .sv-close{margin-left:auto;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px}
  #survey h2{margin:16px 0 4px}
  #survey .intro{margin:0 0 14px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opts button{border:1px solid var(--field-line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:500}
  .opts button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .opts.single{flex-direction:column}
  .opts.single button{border-radius:12px;text-align:left}
  .sv-nav{display:flex;align-items:center;gap:10px;margin-top:20px;position:sticky;bottom:-22px;background:#fff;padding:12px 0 4px}
  .sv-nav .btn{margin-left:auto}
  .review .well+.well{margin-top:10px}
  /* ── Lists of people: one tappable row each ── */
  .ch{font-size:17px;margin:22px 0 8px;letter-spacing:-.01em}
  .section-head .ch{margin-bottom:8px}
  .card.list{padding:0;overflow:hidden}
  .prow{display:flex;align-items:center;gap:10px;padding:14px 16px;color:inherit;text-decoration:none;min-height:52px}
  .prow+.prow{border-top:1px solid var(--line)}
  .prow:active{background:var(--well)}
  .pname{font-weight:600;font-size:16.5px;display:flex;align-items:center;gap:7px;flex:none}
  .pmeta{flex:1;display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:6px}
  .pmeta .with,.pmeta .count{color:var(--faint);font-size:13px}
  .chev{width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(-45deg);flex:none;margin-left:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gift);display:inline-block}
  .tag.done{opacity:.75}

  /* ── Shopping: the three jobs, in order ── */
  .steps{list-style:none;margin:12px 0 4px;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .steps li+li{border-top:1px solid var(--line)}
  .steps a,.steps button,.steps div{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;background:none;border:0;color:inherit;text-decoration:none;font:inherit;text-align:left}
  .steps a span:nth-child(2),.steps button span:nth-child(2),.steps div span:nth-child(2){flex:1}
  .steps li.ok{color:var(--muted)}
  .num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--field-line);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--muted)}
  .num.ok{background:var(--book);border-color:var(--book);color:#fff}
  .alldone{background:var(--book-soft);color:var(--book);border-radius:12px;padding:12px 16px;font-weight:600;margin:12px 0 4px}
  .news{margin:14px 0 0}

  /* ── A person ── */
  .back{display:inline-block;color:var(--accent);text-decoration:none;font-weight:600;font-size:15px;margin:2px 0 8px}
  .pn{font-size:28px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ticks{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .tick{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--field-line);border-radius:14px;padding:13px 15px;cursor:pointer;font-weight:600;font-size:16px}
  .tick input{width:22px;height:22px;accent-color:var(--book);margin:0;flex:none}
  .tick:has(input:checked){background:var(--book-soft);border-color:#b9d8c9;color:var(--book)}
  .tick .sub{display:block;font-weight:500;font-size:13.5px;color:var(--muted);margin-top:2px}
  .card.answers{padding:4px 18px 18px}
  .sec{padding-top:18px}
  .sec+.sec{margin-top:4px;border-top:1px solid var(--line)}
  .sh{display:flex;align-items:center;gap:8px;font-size:15.5px;margin:0 0 10px;letter-spacing:-.005em}
  .sh .aside{margin-left:auto;font-weight:500;color:var(--faint);font-size:12.5px}
  .hero{font-size:17px;line-height:1.55}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .tile{background:var(--well);border-radius:12px;padding:9px 12px}
  .tile.wide{grid-column:1/-1}
  .tile .k,.gkrow .k{font-size:12.5px;font-weight:600;color:var(--muted)}
  .tile .v{font-size:20px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
  .tile.wide .v{font-size:16px;font-weight:600}
  .gk{display:flex;flex-direction:column}
  .gkrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
  .gkrow+.gkrow{border-top:1px solid var(--line)}
  .gkrow .gi{font-size:18px;line-height:1.3;width:22px;text-align:center;flex:none}
  .gkrow.warn{background:var(--warn-soft);border-radius:12px;padding:10px 12px;margin:4px 0;border-top:0}
  .gkrow.warn .k,.gkrow.warn .text{color:var(--warn)}
  .gkrow.warn + .gkrow{border-top:0}
  .pchips{display:flex;flex-wrap:wrap;gap:7px}
  .pchips span{background:#fff;border:1px solid var(--field-line);border-radius:999px;padding:5px 12px;font-size:14.5px}
  .hints li{background:none;border-left:3px solid var(--field-line);border-radius:0;padding:2px 0 2px 12px}
  .hints li .text{font-size:15.5px}
  .btn.small{padding:7px 14px;font-size:14.5px;margin-top:12px}
  .sec .add{margin-top:12px;padding-top:0;border-top:0}

  /* ── Me: four folding sections and one Save ── */
  .cta.big{flex-direction:column;align-items:stretch;text-align:left;gap:12px}
  .cta.big p{flex:none}
  .cta.big .btn{font-size:16.5px;padding:12px 18px}
  .cta.big .link{font-size:14.5px;align-self:center}
  .card.editor{padding:4px 0 16px}
  .fold summary{display:flex;align-items:center;gap:10px;padding:15px 18px;cursor:pointer;list-style:none}
  .fold summary::-webkit-details-marker{display:none}
  .fold summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin:-4px 2px 0 4px;transition:transform .15s}
  .fold[open] summary::after{transform:rotate(-135deg);margin-top:4px}
  .fold+.fold{border-top:1px solid var(--line)}
  .fi{font-size:18px}
  .ft{font-weight:600;font-size:16px;flex:1}
  .st{font-size:13px;color:var(--faint);font-weight:500}
  .st.ok{color:var(--book);font-weight:600}
  .fb{padding:0 18px 18px}
  .editor .actions{padding:4px 18px 0;margin-top:6px;border-top:1px solid var(--line);padding-top:14px}
  .retake{color:var(--muted);font-size:14px;text-align:center;margin:-4px 0 8px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:10;background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .loading{color:var(--muted);text-align:center;padding:48px 0}
</style>
</head>
<body>
<div id="snow" aria-hidden="true"></div>
<div class="wrap">
  <header class="top"><div class="brand"><span class="flake" aria-hidden="true">❄</span>Secret Santa</div><div class="hello" id="hello"></div></header>
  <nav class="tabs" id="tabs" hidden></nav>
  <main id="view"><p class="loading">Loading…</p></main>
</div>
<div id="survey" hidden role="dialog" aria-modal="true" aria-label="About me survey"></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (path, method = "GET", body) =>
  fetch("/ss/api" + path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body && JSON.stringify(body) })
    .then((r) => (r.ok ? r.json() : Promise.reject(r)));

// ── Snow. A few dozen dots, three depths by size and opacity, each animated by CSS alone. ──
(function snow() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const n = Math.min(44, Math.max(18, Math.round(innerWidth / 16)));
  let h = "";
  for (let i = 0; i < n; i++) {
    const depth = Math.random(); // 0 = far, 1 = near
    const size = (1.6 + depth * 3.4).toFixed(1);
    const dur = (30 - depth * 14 + Math.random() * 6).toFixed(1);
    h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;width:${size}px;height:${size}px;opacity:${(0.5 + depth * 0.45).toFixed(2)};` +
      `animation-duration:${dur}s;animation-delay:-${(Math.random() * dur).toFixed(1)}s;` +
      `--x:${Math.round((Math.random() - 0.5) * 90)}px;--s:${Math.round(8 + Math.random() * 22)}px"></i>`;
  }
  $("#snow").innerHTML = h;
})();

const PROMPTS = {
  gift: { label: "Gift ideas", placeholder: "Hobbies, things you've been eyeing, a wish-list link — anything that would make a good gift." },
  book: { label: "Book ideas", placeholder: "What you like to read, a few favorites, authors or genres you'd try — and what you've already read, so nobody repeats it." },
};

let state;
let editingAssignment = false;
let editingGiver = null;   // organizer: whose assignment is open
const drafts = new Map();  // unsaved text survives a re-render caused by saving something else

// ── What's new since your last visit ──
// `since` is the server time of your previous visit, read ONCE when the page opens. It must not be re-read on later
// load() calls: load() runs again after every save, and re-reading then would wipe the badges mid-visit. The mark is
// written when you leave (tab hidden or page closed) as the server time of the latest /me, so your own saves are
// always older than it. No stored mark (first visit, storage cleared or blocked) means nothing is shown as new.
let since;
const seenKey = () => "ss:seen:" + state.me.id;
function readSeen() { try { const v = Number(localStorage.getItem(seenKey())); return v > 0 ? v : null; } catch { return null; } }
function writeSeen() { if (!state) return; try { localStorage.setItem(seenKey(), String(state.now)); } catch {} }
addEventListener("pagehide", writeSeen);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") writeSeen(); });
const isNewHint = (h) => !!since && !h.mine && h.updated > since;
const hasDetails = (about) => Object.keys(about.details || {}).length > 0;
const isNewAbout = (p) => !!since && p.about.updated > since && !!(p.about.gift.trim() || p.about.book.trim() || hasDetails(p.about));
const newHints = (p) => p.hints.filter(isNewHint).length;

// ── Where you are ─────────────────────────────────────────────────────────────
// Three tabs in the order you use them — say what you'd like, then shop, then browse — plus one page per person,
// reached from either list. The person page is the only place a person is drawn in full, so there is one place to
// read their answers, one place to tick them off and one place to leave a hint.
const TABS = [
  { id: "me", label: "Me" },
  { id: "shop", label: "Shopping" },
  { id: "people", label: "People" },
  { id: "organizer", label: "Organizer", organizerOnly: true },
];
const tabs = () => TABS.filter((t) => !t.organizerOnly || state.isOrganizer);
const OLD = { list: "shop", everyone: "people" }; // links from before the redesign still land somewhere sensible

/** `{tab, person?, kid?}` from the URL. A person page belongs to whichever list you came from. */
function route() {
  const h = location.hash.slice(1);
  const [head, arg] = h.split("/");
  if (head === "p" && arg && personOf(arg)) return { tab: lastList, person: arg };
  if (head === "me" && arg && state.people.some((p) => p.id === arg && p.kid && p.canEdit)) return { tab: "me", kid: arg };
  const id = OLD[head] ?? head;
  return { tab: tabs().some((t) => t.id === id) ? id : landing() };
}
const currentTab = () => route().tab;
let lastList = "shop"; // where a person page's Back goes
/** First visit lands on Me until you've written something — it's the first job — and on Shopping after that. */
const landing = () => (aboutEmpty(state.me.about) ? "me" : "shop");
const aboutEmpty = (a) => !a.gift.trim() && !a.book.trim() && !hasDetails(a);

async function load() {
  state = await api("/me");
  if (since === undefined) since = readSeen();
  state.organizer = state.isOrganizer ? await api("/assignments") : null;
  // Pin the landing tab in the URL so saving your first answer doesn't move you somewhere else mid-thought.
  if (!location.hash) history.replaceState(null, "", "#" + landing());
  render();
}

const coupleOf = (id) => (state.bookCouples || []).find((c) => c.includes(id));
/** A book for either partner is the couple's one book, compared by its first id — the same rule as the Worker. */
const bookKey = (id) => coupleOf(id)?.[0] ?? id;
const bookName = (id) => (coupleOf(id) || [id]).map((x) => nameOf(x)).join(" and ");
const partnerOf = (id) => (coupleOf(id) || []).find((x) => x !== id);
const target = (id, kind) => (kind === "book" ? bookKey(id) : id);
const hasBook = (id) => !!state.assignment.book && bookKey(id) === state.assignment.book;
const isBought = (id, kind) => state.bought.some((b) => b.kind === kind && b.person === target(id, kind));
const collabs = (id, kind) => state.collaborators.find((c) => c.kind === kind && c.person === target(id, kind))?.givers ?? [];
const nameOf = (id) => (id === state.me.id ? state.me.name : state.people.find((p) => p.id === id)?.name ?? id);
const personOf = (id) => state.people.find((p) => p.id === id);
const myKinds = (p) => [...(state.assignment.gifts.includes(p.id) || p.kid ? ["gift"] : []), ...(hasBook(p.id) ? ["book"] : [])];
const isNew = (p) => newHints(p) > 0 || isNewAbout(p);
const andList = (xs) => (xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs[xs.length - 1]}`);

function draftArea(key, value, attrs = "") {
  const v = drafts.has(key) ? drafts.get(key) : value;
  return `<textarea data-draft="${esc(key)}" ${attrs}>${esc(v)}</textarea>`;
}
function draftInput(key, value, attrs = "") {
  const v = drafts.has(key) ? drafts.get(key) : value;
  return `<input class="detail" data-draft="${esc(key)}" value="${esc(v)}" ${attrs}>`;
}
const fieldsIn = (group) => state.detailFields.filter((f) => f.group === group);

// ── Small pieces ─────────────────────────────────────────────────────────────

/** The pills on a row: what you're getting them, ticked once you have it. Nothing for a person you aren't. */
function pills(p) {
  const a = state.assignment;
  const done = (kind) => (isBought(p.id, kind) ? " ✓" : "");
  return (a.gifts.includes(p.id) ? `<span class="tag gift${isBought(p.id, "gift") ? " done" : ""}">🎁 Gift${done("gift")}</span>` : "") +
    (hasBook(p.id) ? `<span class="tag book${isBought(p.id, "book") ? " done" : ""}">📕 Book${done("book")}</span>` : "");
}

/** One row in a list of people: name, a dot if something's new, your pills, a chevron. The whole row is the link. */
function personRow(p, extra = "") {
  return `<a class="prow" href="#p/${esc(p.id)}"><span class="pname">${esc(p.name)}${isNew(p) ? `<span class="dot" aria-label="Something new"></span>` : ""}</span>
    <span class="pmeta">${extra}${pills(p)}</span><span class="chev" aria-hidden="true"></span></a>`;
}

/**
 * The tick under a person's name. No box around it and no heading: the row you tapped already said you're
 * buying for them, so all this has to do is let you say you've got it — and who else is on it.
 */
function tickLine(p, kind) {
  const who = kind === "book" ? bookName(p.id) : p.name;
  const label = kind === "book" ? `Got the book for ${esc(who)}` : p.kid ? `Got something for ${esc(p.name)}` : `Got ${esc(p.name)}'s gift`;
  const others = collabs(p.id, kind);
  const thing = kind === "book" ? "a book" : "a gift";
  const sub = !others.length ? ""
    : others.length === 1
      ? `${esc(others[0].name)} is getting ${esc(who)} ${thing} too · ${others[0].bought ? "already got it" : "not yet"}`
      : `Also getting ${esc(who)} ${thing}: ${others.map((g) => `${esc(g.name)} (${g.bought ? "got it" : "not yet"})`).join(", ")}`;
  return `<label class="tick"><input type="checkbox" data-bought="${kind}" data-for="${esc(p.id)}" ${isBought(p.id, kind) ? "checked" : ""}>
    <span>${label}${sub ? `<span class="sub">${sub}</span>` : ""}</span></label>`;
}

const LIKE_ICON = { colors: "🎨", treats: "🍫", brands: "🛍️", avoid: "⚠️" };

/** What somebody would like, each kind of answer in its own shape. Sections they haven't filled in aren't drawn. */
function answers(p, { bookFirst = false } = {}) {
  const a = p.about, d = a.details || {};
  const sec = (icon, title, body) => `<section class="sec"><h3 class="sh"><span aria-hidden="true">${icon}</span>${title}</h3>${body}</section>`;
  const gift = a.gift.trim() ? sec("🎁", "Gift ideas", `<p class="hero text">${esc(a.gift.trim())}</p>`) : "";
  const book = a.book.trim() ? sec("📕", "Book ideas", `<p class="hero text">${esc(a.book.trim())}</p>`) : "";
  const sizes = fieldsIn("sizes").filter((f) => d[f.key]);
  const sizeSec = sizes.length ? sec("📏", "Sizes", `<div class="tiles">${sizes.map((f) =>
    `<div class="tile${f.key === "otherSizes" ? " wide" : ""}"><div class="k">${esc(f.label)}</div><div class="v">${esc(d[f.key])}</div></div>`).join("")}</div>`) : "";
  const likes = fieldsIn("likes").filter((f) => d[f.key] && f.key !== "stocking");
  const likeSec = likes.length ? sec("💡", "Good to know", `<div class="gk">${likes.map((f) =>
    `<div class="gkrow${f.key === "avoid" ? " warn" : ""}"><span class="gi" aria-hidden="true">${LIKE_ICON[f.key] ?? "•"}</span><div><div class="k">${esc(f.label)}</div><div class="text">${esc(d[f.key])}</div></div></div>`).join("")}</div>`) : "";
  const stocking = (d.stocking || "").split(",").map((s) => s.trim()).filter(Boolean);
  const stockSec = stocking.length ? sec("🧦", "Stocking stuffers", `<div class="pchips">${stocking.map((s) => `<span>${esc(s.charAt(0).toUpperCase() + s.slice(1))}</span>`).join("")}</div>`) : "";
  const all = bookFirst ? [book, gift, sizeSec, likeSec, stockSec] : [gift, sizeSec, likeSec, stockSec, book];
  const body = all.join("");
  return body || `<p class="empty">${esc(p.name)} hasn't filled anything in yet.</p>`;
}

function hintsSection(p) {
  const list = p.hints.map((h) => `<li data-hint="${h.id}"><p class="text">${esc(h.text)}</p>
      <div class="by">${esc(h.author)}${isNewHint(h) ? ` <span class="tag new">New</span>` : ""}${h.mine ? ` · <button class="link" data-action="edit-hint">Edit</button><button class="link" data-action="delete-hint">Delete</button>` : ""}</div></li>`).join("");
  const form = hintFormFor === p.id
    ? `<div class="add" data-add-hint="${esc(p.id)}">${draftArea("hint:" + p.id, "", `placeholder="A gift or book idea for ${esc(p.name)}…" autofocus`)}
        <div class="actions"><button class="btn" data-action="add-hint">Add hint</button><button class="link" data-action="hide-hint-form">Cancel</button><span class="status"></span></div></div>`
    : `<button class="btn outline small" data-action="show-hint-form" data-for="${esc(p.id)}">Leave a hint</button>`;
  return `<section class="sec"><h3 class="sh"><span aria-hidden="true">🤫</span>Secret hints<span class="aside">Hidden from ${esc(p.name)}</span></h3>
    ${list ? `<ul class="hints">${list}</ul>` : `<p class="empty">No hints yet. Know something ${esc(p.name)} would love?</p>`}${form}</section>`;
}
let hintFormFor = null;

// ── Shopping ─────────────────────────────────────────────────────────────────

const bookTag = `<span class="tag book">📕 Book exchange</span>`;
const giftTag = `<span class="tag gift">🎁 Gift</span>`;

/** Tick-boxes for gifts, one radio for the book. For your own assignment and, for an organizer, anybody's. */
let pickerSeq = 0;
function picker(giver, a, cancellable) {
  const group = `book-${++pickerSeq}`; // radio groups are per document; two open pickers must not share one
  const candidates = [state.me, ...state.people].filter((p) => !p.kid && p.id !== giver);
  const opt = (type, kind, p, on) =>
    `<label><input type="${type}" ${type === "radio" ? `name="${group}"` : ""} data-kind="${kind}" value="${esc(p.id)}" ${on ? "checked" : ""}>${esc(p.name)}</label>`;
  return `<div data-picker="${esc(giver)}">
    <div class="pick"><h4 class="label">🎁 Gifts</h4><div class="choices">${candidates.map((p) => opt("checkbox", "gift", p, a.gifts.includes(p.id))).join("")}</div></div>
    <div class="pick"><h4 class="label">📕 Book exchange</h4><div class="choices">${candidates
      // A couple is one book: offered once, under both names, and never to either partner.
      .filter((p) => bookKey(p.id) === p.id && !(coupleOf(p.id) || []).includes(giver))
      .map((p) => opt("radio", "book", { id: p.id, name: bookName(p.id) }, a.book === p.id)).join("")}</div></div>
    <div class="actions"><button class="btn" data-action="save-assignment">Save</button>${cancellable ? `<button class="link" data-action="cancel-assignment">Cancel</button>` : ""}<span class="status"></span></div>
  </div>`;
}

function shopTab() {
  const a = state.assignment;
  const assigned = a.gifts.length > 0 || !!a.book;
  const things = [...a.gifts.map((id) => [id, "gift"]), ...(a.book ? [[a.book, "book"]] : [])];
  const got = things.filter(([id, kind]) => isBought(id, kind)).length;
  const wrote = !aboutEmpty(state.me.about);
  const steps = [
    { done: wrote, text: "Tell people what you'd like", href: "#me" },
    { done: assigned, text: "Add who you're buying for", action: "edit-assignment" },
    { done: assigned && got === things.length, text: assigned ? `Get the gifts · ${got} of ${things.length}` : "Get the gifts" },
  ];
  const allDone = steps.every((s) => s.done);
  const checklist = allDone ? `<p class="alldone">🎉 You're all set — everything's bought.</p>` : `<ol class="steps">${steps.map((s, i) => {
    const inner = `<span class="num${s.done ? " ok" : ""}">${s.done ? "✓" : i + 1}</span><span>${s.text}</span>`;
    return `<li class="${s.done ? "ok" : ""}">${s.href && !s.done ? `<a href="${s.href}">${inner}<span class="chev" aria-hidden="true"></span></a>`
      : s.action && !s.done ? `<button data-action="${s.action}">${inner}<span class="chev" aria-hidden="true"></span></button>` : `<div>${inner}</div>`}</li>`;
  }).join("")}</ol>`;

  if (!assigned || editingAssignment) {
    return `<h2>Shopping</h2>${checklist}
      <div class="card"><h3 class="ch">Who are you buying for?</h3><p class="intro">Tick the people from Anne's text.</p>${picker(state.me.id, a, assigned)}</div>
      <p class="note">🔒 ${seenBy()}</p>`;
  }
  // A shared book puts both partners on your list: you're shopping from both of their notes.
  const ids = [...new Set([...a.gifts, ...(a.book ? coupleOf(a.book) || [a.book] : [])])];
  const people = ids.map(personOf).filter(Boolean);
  const news = people.flatMap((p) => {
    const n = newHints(p);
    return [...(n ? [`${n} new hint${n === 1 ? "" : "s"} for ${esc(p.name)}`] : []), ...(isNewAbout(p) ? [`new ideas from ${esc(p.name)}`] : [])];
  });
  // Who else is on a person is said on their page, next to the tick it belongs to: on a row it can't say
  // whether it's the gift or the book, and "with Jack" on Rob's row read as Jack splitting Rob's gift.
  const rows = people.map((p) => personRow(p)).join("");
  return `<h2>Shopping</h2>${checklist}
    ${news.length ? `<p class="news">✨ Since your last visit: ${news.join(" · ")}</p>` : ""}
    <div class="section-head"><h3 class="ch">Your list</h3><button class="link" data-action="edit-assignment">Change</button></div>
    <div class="card list">${rows}</div>
    <p class="note">🔒 ${seenBy()}</p>`;
}
const seenBy = () => (state.isOrganizer ? "Only you can see who you're buying for." : "Only you and Anne can see who you're buying for.");

// ── People ───────────────────────────────────────────────────────────────────

function peopleTab() {
  const adults = state.people.filter((p) => !p.kid), kids = state.people.filter((p) => p.kid);
  const row = (p) => personRow(p, p.hints.length ? `<span class="count">${p.hints.length} hint${p.hints.length === 1 ? "" : "s"}</span>` : "");
  return `<h2>People</h2><p class="intro">Read anyone's wish list, and leave a secret hint they won't see.</p>
    <div class="card list">${adults.map(row).join("")}</div>
    ${kids.length ? `<h3 class="ch">Kids</h3><p class="intro">Nobody's assigned the kids — a gift for them is a bonus.</p><div class="card list">${kids.map(row).join("")}</div>` : ""}`;
}

// ── A person ─────────────────────────────────────────────────────────────────

function personPage(id) {
  const p = personOf(id);
  const kinds = myKinds(p);
  const bookFirst = kinds.includes("book") && !kinds.includes("gift");
  const back = lastList === "people" ? "People" : "Shopping";
  return `<a class="back" href="#${lastList}">‹ ${back}</a>
    <h2 class="pn">${esc(p.name)}${isNewAbout(p) ? `<span class="tag new">Updated</span>` : ""}</h2>
    ${kinds.length ? `<div class="ticks">${kinds.map((k) => tickLine(p, k)).join("")}</div>` : ""}
    <div class="card answers">${answers(p, { bookFirst })}</div>
    <div class="card">${hintsSection(p)}</div>`;
}

// ── Me ───────────────────────────────────────────────────────────────────────

const detailKey = (id, key) => `about:${id}:d:${key}`;
const openFolds = new Set(); // which sections of the editor are open, kept across re-renders

function detailFields(id, details, group) {
  return fieldsIn(group).map((f) => {
    const k = detailKey(id, f.key);
    const value = drafts.has(k) ? drafts.get(k) : details[f.key] || "";
    const chips = f.chips ? `<div class="chips">${f.chips.map((c) =>
      `<button type="button" data-action="chip" data-value="${esc(c)}" aria-pressed="${value === c}">${esc(c)}</button>`).join("")}</div>` : "";
    const inputID = `d-${id}-${f.key}`;
    return `<div><label for="${esc(inputID)}">${esc(f.label)}</label>${draftInput(k, details[f.key] || "",
      `id="${esc(inputID)}" data-detail="${esc(f.key)}" maxlength="${state.detailMax || 400}" autocomplete="off" placeholder="e.g. ${esc(f.placeholder)}"`)}${chips}</div>`;
  }).join("");
}

/** The four parts of About me, each folded to one line that says how far along it is. One Save for all four. */
function aboutEditor(id, about) {
  const d = about.details || {};
  const count = (group) => fieldsIn(group).filter((f) => d[f.key]).length;
  const status = (n, of) => (n === 0 ? `<span class="st">Empty</span>` : n === of ? `<span class="st ok">Done</span>` : `<span class="st">${n} of ${of}</span>`);
  const fold = (key, icon, title, st, body) => `<details class="fold" data-fold="${id}:${key}" ${openFolds.has(`${id}:${key}`) ? "open" : ""}>
    <summary><span class="fi" aria-hidden="true">${icon}</span><span class="ft">${title}</span>${st}</summary><div class="fb">${body}</div></details>`;
  const sizes = fieldsIn("sizes"), likes = fieldsIn("likes");
  return `<div class="card editor" data-about="${esc(id)}">
    ${fold("gift", "🎁", "Gift ideas", status(about.gift.trim() ? 1 : 0, 1), `${draftArea(`about:${id}:gift`, about.gift, `name="gift" placeholder="${esc(PROMPTS.gift.placeholder)}"`)}`)}
    ${fold("sizes", "📏", "Sizes", status(count("sizes"), sizes.length), `<p class="hint-text">Whatever you'd tell a store clerk. Skip any you'd rather not share.</p><div class="details">${detailFields(id, d, "sizes")}</div>`)}
    ${fold("likes", "💡", "Good to know", status(count("likes"), likes.length), `<p class="hint-text">The small things that make a gift feel like it's for you.</p><div class="details">${detailFields(id, d, "likes")}</div>`)}
    ${fold("book", "📕", "Book ideas", status(about.book.trim() ? 1 : 0, 1), `${draftArea(`about:${id}:book`, about.book, `name="book" placeholder="${esc(PROMPTS.book.placeholder)}"`)}`)}
    <div class="actions"><button class="btn" data-action="save-about">Save</button><span class="status"></span></div></div>`;
}

function meTab(kidID) {
  if (kidID) {
    const k = personOf(kidID);
    return `<a class="back" href="#me">‹ Me</a><h2>${esc(k.name)}</h2>
      <p class="intro">You're filling this in for ${esc(k.name)}. Everyone can read it.</p>${aboutEditor(k.id, k.about)}`;
  }
  const empty = aboutEmpty(state.me.about);
  const survey = empty
    ? `<div class="card cta big"><p><strong>✨ Start with 7 quick questions</strong>About 90 seconds. We'll fill this in for you, stocking stuffers included.</p>
        <button class="btn" data-action="survey">Start the survey</button><button class="link" data-action="fill-yourself">or fill it in yourself</button></div>`
    : "";
  const kids = state.people.filter((p) => p.kid && p.canEdit);
  return `<h2>What you'd like</h2><p class="intro">Whoever's buying for you reads this — and so can everyone else.</p>
    ${survey}${aboutEditor(state.me.id, state.me.about)}
    ${empty ? "" : `<p class="retake">Want ideas? <button class="link" data-action="survey">Take the 90-second survey</button></p>`}
    ${kids.length ? `<h3 class="ch">Also yours to fill in</h3><div class="card list">${kids.map((k) =>
      `<a class="prow" href="#me/${esc(k.id)}"><span class="pname">${esc(k.name)}</span><span class="pmeta">${aboutEmpty(k.about) ? `<span class="count">Not started</span>` : ""}</span><span class="chev" aria-hidden="true"></span></a>`).join("")}</div>` : ""}`;
}

// ── Organizer ────────────────────────────────────────────────────────────────

function organizerTab() {
  const givers = state.organizer.givers;
  const adults = givers.map((g) => g.id);
  const books = new Set(givers.map((g) => g.book).filter(Boolean));
  const gifted = new Set(givers.flatMap((g) => g.gifts));
  const noGift = adults.filter((id) => !gifted.has(id));
  // A couple is covered by one book, and listed once.
  const noBook = [...new Set(adults.filter((id) => !books.has(bookKey(id))).map(bookKey))];
  const bookGivers = (key) => givers.filter((g) => g.book === key);
  // Two *households* on one book is a mistake; a couple giving one book together (Rob and Laura both ticking
  // Kellie) is the point, so givers are counted by couple too.
  const doubled = [...books].filter((key) => new Set(bookGivers(key).map((g) => bookKey(g.id))).size > 1);
  const entered = givers.filter((g) => g.gifts.length || g.book).length;
  const list = (ids) => ids.map((id) => esc(nameOf(id))).join(", ");
  const bookList = (ids) => ids.map((id) => esc(bookName(id))).join(", ");

  let h = `<h2>Organizer</h2><p class="intro">What everyone has ticked. You can change anybody's, and they can still change their own. Only you can see this.</p>`;
  h += `<div class="card"><h4 class="label">Progress</h4><p><strong>${entered} of ${givers.length}</strong> people have an assignment entered.</p>
    <div class="meter"><span style="width:${Math.round((entered / givers.length) * 100)}%"></span></div>
    ${noGift.length ? `<p class="gap">${giftTag.replace("Gift", "No gift yet")}<span>${list(noGift)}</span></p>` : ""}
    ${noBook.length ? `<p class="gap">${bookTag.replace("Book exchange", "No book yet")}<span>${bookList(noBook)}</span></p>` : ""}
    ${doubled.map((key) => `<p class="gap">${bookTag.replace("Book exchange", "Two books")}<span>${esc(bookName(key))} — from ${list(bookGivers(key).map((g) => g.id))}</span></p>`).join("")}
    ${!noGift.length && !noBook.length && !doubled.length ? `<p class="gap">Everyone has a gift and a book coming. 🎄</p>` : ""}</div>`;
  h += `<div class="card rows" style="padding:0">` + givers.map((g) => {
    if (editingGiver === g.id) return `<div class="giver editing"><p style="margin-bottom:12px"><strong>${esc(g.name)}</strong> is buying for…</p>${picker(g.id, g, true)}</div>`;
    const what = g.gifts.length || g.book
      ? g.gifts.map((id) => `<span class="tag gift">🎁 ${esc(nameOf(id))}</span>`).join("") + (g.book ? `<span class="tag book">📕 ${esc(bookName(g.book))}</span>` : "")
      : `<span class="empty" style="font-size:14px">Nothing yet</span>`;
    return `<div class="giver"><span class="who">${esc(g.name)}</span><span class="what">${what}</span><button class="link" data-action="edit-giver" data-giver="${esc(g.id)}">Edit</button></div>`;
  }).join("") + `</div>`;
  return h;
}

function render() {
  const r = route();
  if (r.tab === "shop" || r.tab === "people") lastList = r.tab;
  $("#hello").textContent = `Hi, ${state.me.name}`;
  const nav = $("#tabs");
  nav.hidden = false;
  nav.innerHTML = `<div class="seg">${tabs().map((t) => `<a href="#${t.id}" ${t.id === r.tab ? `aria-current="page"` : ""}>${t.label}</a>`).join("")}</div>`;
  $("#view").innerHTML = r.person ? personPage(r.person)
    : r.tab === "me" ? meTab(r.kid)
    : { shop: shopTab, people: peopleTab, organizer: organizerTab }[r.tab]();
}

addEventListener("hashchange", () => { if (state) { hintFormFor = null; editingAssignment = false; render(); scrollTo(0, 0); } });

function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("on"), 1800);
}

async function run(button, status, work, { clear = [], done = "Saved" } = {}) {
  button.disabled = true;
  if (status) status.textContent = "Saving…";
  try {
    await work();
    clear.forEach((k) => drafts.delete(k));
    await load();
    toast(done);
  } catch {
    if (status) status.textContent = "Couldn't save. Try again.";
    button.disabled = false;
  }
}

$("#view").addEventListener("input", (e) => {
  if (e.target.dataset.draft) drafts.set(e.target.dataset.draft, e.target.value);
  if (e.target.dataset.detail) {
    e.target.parentElement.querySelectorAll(".chips button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === e.target.value.trim())));
  }
});

$("#view").addEventListener("click", async (e) => {
  const button = e.target.closest("[data-action]");
  if (!button) return;
  const action = button.dataset.action;
  const status = button.parentElement.querySelector(".status");

  if (action === "survey") return openSurvey().catch(() => toast("Couldn't open the survey. Try again."));
  if (action === "chip") {
    // Fill the field rather than replace the form: tapping "L" puts L in the box, tapping it again empties it,
    // and anything typed after ("L, tall") is the person's own business.
    const input = button.closest(".chips").parentElement.querySelector("input[data-detail]");
    input.value = button.getAttribute("aria-pressed") === "true" ? "" : button.dataset.value;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    return;
  }
  if (action === "edit-assignment") { editingAssignment = true; return render(); }
  if (action === "fill-yourself") { openFolds.add(`${state.me.id}:gift`); render(); return $("[data-about] textarea[name=gift]")?.focus(); }
  if (action === "show-hint-form") { hintFormFor = button.dataset.for; render(); return $("[data-add-hint] textarea")?.focus(); }
  if (action === "hide-hint-form") { hintFormFor = null; return render(); }
  if (action === "edit-giver") { editingGiver = button.dataset.giver; return render(); }
  if (action === "cancel-assignment") {
    if (currentTab() === "organizer") editingGiver = null; else editingAssignment = false;
    return render();
  }
  if (action === "save-assignment") {
    const box = button.closest("[data-picker]");
    const giver = box.dataset.picker;
    const gifts = [...box.querySelectorAll("input[data-kind=gift]:checked")].map((i) => i.value);
    const book = box.querySelector("input[data-kind=book]:checked")?.value ?? null;
    if (book && gifts.includes(book) && !confirm(`${nameOf(book)} is ticked for a gift and the book. Save anyway?`)) return;
    // Your own goes through your own route even if you're the organizer; anybody else's through theirs.
    const own = currentTab() !== "organizer";
    return run(button, status, async () => {
      await api(own ? "/assignment" : `/assignments/${giver}`, "PUT", { gifts, book });
      if (own) editingAssignment = false; else editingGiver = null;
    });
  }
  if (action === "save-about") {
    const card = button.closest("[data-about]");
    const id = card.dataset.about;
    const details = Object.fromEntries([...card.querySelectorAll("input[data-detail]")].map((i) => [i.dataset.detail, i.value]));
    return run(button, status, () => api("/about", "PUT", { person: id, gift: $("[name=gift]", card).value, book: $("[name=book]", card).value, details }),
      { clear: [`about:${id}:gift`, `about:${id}:book`, ...Object.keys(details).map((k) => detailKey(id, k))] });
  }
  if (action === "add-hint") {
    const box = button.closest("[data-add-hint]");
    const text = $("textarea", box).value.trim();
    if (!text) return;
    return run(button, status, async () => { await api("/hints", "POST", { subject: box.dataset.addHint, text }); hintFormFor = null; },
      { clear: ["hint:" + box.dataset.addHint], done: "Hint added" });
  }
  const hint = button.closest("[data-hint]");
  if (action === "edit-hint") {
    const current = $(".text", hint).textContent;
    const text = prompt("Edit your hint", current);
    if (text === null || !text.trim() || text === current) return;
    return run(button, null, () => api(`/hints/${hint.dataset.hint}`, "PUT", { text }));
  }
  if (action === "delete-hint") {
    if (!confirm("Delete this hint?")) return;
    return run(button, null, () => api(`/hints/${hint.dataset.hint}`, "DELETE", {}), { done: "Hint deleted" });
  }
});

// ── The survey ─────────────────────────────────────────────────────────────
// Questions, suggestions and the wording of the result live in survey.js, which the tests import too. This
// part only draws it. The result fills the same form you'd type into and saves through the same button, so
// there is one way to write About me, not two — and it only ever adds to what's there.
let S;            // the module, loaded the first time somebody opens the survey
let survey = null; // { step, answers } while open; kept if you close it, so reopening picks up where you were
const surveyEl = $("#survey");

async function openSurvey() {
  if (!S) S = await import("/ss/survey.js");
  if (!survey) survey = { step: 0, answers: {} };
  surveyEl.hidden = false;
  document.body.style.overflow = "hidden";
  renderSurvey();
}
function closeSurvey() { surveyEl.hidden = true; document.body.style.overflow = ""; }

function renderSurvey() {
  const steps = S.STEPS, n = steps.length, i = survey.step, a = survey.answers;
  const top = (label, pct) => `<div class="sv-top"><span>${label}</span><div class="meter"><span style="width:${pct}%"></span></div>
    <button class="sv-close" data-sv="close" aria-label="Close">×</button></div>`;
  if (i >= n) {
    const out = S.compose(a, state.detailMax || 400);
    const label = (k) => state.detailFields.find((f) => f.key === k)?.label ?? k;
    const parts = [
      out.gift ? `<div class="well"><div class="idea-label">${PROMPTS.gift.label}</div><p class="text">${esc(out.gift)}</p></div>` : "",
      ...Object.entries(out.details).map(([k, v]) => `<div class="well"><div class="idea-label">${esc(label(k))}</div><p class="text">${esc(v)}</p></div>`),
    ].join("");
    surveyEl.innerHTML = `<div class="sheet">${top("Done", 100)}<h2>Here's what we'll add</h2>
      <p class="intro">It goes after anything you've already written — nothing is replaced. You can edit it afterwards.</p>
      <div class="review">${parts || `<p class="empty">You skipped everything, so there's nothing to add.</p>`}</div>
      <div class="sv-nav"><button class="link" data-sv="back">Back</button>${parts ? `<button class="btn" data-sv="apply">Add to About me</button>` : `<button class="btn" data-sv="close">Close</button>`}</div></div>`;
    return;
  }
  const step = steps[i];
  const options = typeof step.options === "function" ? step.options(a) : step.options || [];
  const picked = a[step.id] ?? (step.multi ? [] : null);
  const body = step.text
    ? `<textarea data-sv-text placeholder="A thing, a shop, a link…">${esc(a[step.id] ?? "")}</textarea>`
    : `<div class="opts${step.multi ? "" : " single"}">${options.map((o) =>
        `<button type="button" data-sv="pick" data-value="${esc(o)}" aria-pressed="${step.multi ? picked.includes(o) : picked === o}">${esc(o)}</button>`).join("")}</div>`;
  const answered = step.text ? !!(a[step.id] ?? "").trim() : step.multi ? picked.length > 0 : picked !== null;
  surveyEl.innerHTML = `<div class="sheet">${top(`${i + 1} of ${n}`, Math.round((i / n) * 100))}
    <h2>${esc(step.title)}</h2>${step.hint ? `<p class="intro">${esc(step.hint)}</p>` : `<p class="intro"></p>`}${body}
    <div class="sv-nav">${i ? `<button class="link" data-sv="back">Back</button>` : ""}<button class="btn" data-sv="next">${answered ? "Next" : "Skip"}</button></div></div>`;
}

surveyEl.addEventListener("click", (e) => {
  if (e.target === surveyEl) return closeSurvey();
  const b = e.target.closest("[data-sv]");
  if (!b) return;
  const act = b.dataset.sv, step = S.STEPS[survey.step], a = survey.answers;
  if (act === "close") return closeSurvey();
  if (act === "back") { survey.step = Math.max(0, survey.step - 1); return renderSurvey(); }
  if (act === "next") { survey.step++; return renderSurvey(); }
  if (act === "pick") {
    const v = b.dataset.value;
    if (step.multi) { const list = a[step.id] ?? []; a[step.id] = list.includes(v) ? list.filter((x) => x !== v) : [...list, v]; }
    else a[step.id] = a[step.id] === v ? null : v;
    // Stocking ideas come from the earlier answers: a pick that's no longer offered goes with it.
    if (step.id !== "stocking" && a.stocking) { const offered = S.suggestStocking(a); a.stocking = a.stocking.filter((x) => offered.includes(x)); }
    if (!step.multi && a[step.id]) { survey.step++; }
    return renderSurvey();
  }
  if (act === "apply") return applySurvey();
});
surveyEl.addEventListener("input", (e) => {
  if (!e.target.matches("[data-sv-text]")) return;
  survey.answers[S.STEPS[survey.step].id] = e.target.value;
  const next = $("[data-sv=next]", surveyEl);
  if (next) next.textContent = e.target.value.trim() ? "Next" : "Skip";
});
addEventListener("keydown", (e) => { if (e.key === "Escape" && !surveyEl.hidden) closeSurvey(); });

function applySurvey() {
  const out = S.compose(survey.answers, state.detailMax || 400);
  const card = document.querySelector(`[data-about="${CSS.escape(state.me.id)}"]`);
  if (!card) return closeSurvey();
  const set = (el, v) => { el.value = v; el.dispatchEvent(new Event("input", { bubbles: true })); };
  const gift = $("[name=gift]", card);
  set(gift, S.merge(gift.value, out.gift, "\n\n", 4000));
  for (const [k, v] of Object.entries(out.details)) {
    const input = $(`input[data-detail="${k}"]`, card);
    if (input) set(input, S.merge(input.value, v, k === "stocking" ? ", " : "; ", state.detailMax || 400));
  }
  survey = null;
  closeSurvey();
  // The same Save as typing it in: one write path, one toast, one place it can fail and say so.
  $("[data-action=save-about]", card).click();
}

$("#view").addEventListener("change", async (e) => {
  const box = e.target.closest("input[data-bought]");
  if (!box) return;
  box.disabled = true;
  try {
    await api("/bought", "PUT", { person: box.dataset.for, kind: box.dataset.bought, bought: box.checked });
    await load();
    toast(box.checked ? "Got it ✓" : "Unticked");
  } catch {
    box.checked = !box.checked;
    box.disabled = false;
    toast("Couldn't save. Try again.");
  }
});

document.addEventListener("toggle", (e) => {
  const d = e.target.closest?.("details[data-fold]");
  if (d) d.open ? openFolds.add(d.dataset.fold) : openFolds.delete(d.dataset.fold);
}, true);

load().catch((r) => {
  $("#view").innerHTML = `<div class="card" style="text-align:center;margin-top:24px">
    <p style="font-weight:600;margin-bottom:6px">${r && r.status === 403 ? "Your link has expired" : "Something went wrong"}</p>
    <p class="empty">Reopen Secret Santa from the trip board in the Majestic app.</p></div>`;
});
</script>
